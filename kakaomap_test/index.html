<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시원한길</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="mode-filters" id="mode-filters">
            <button class="active" data-mode="전체">전체</button>
            <button data-mode="노약자">노약자</button>
            <button data-mode="반려동물">반려동물</button>
            <button data-mode="일반">일반</button>
        </div>

        <div id="route-list-container"></div>

        <div id="bottom-sheet" style="display: none;">
            <div class="sheet-header">
                <h4>현재 구간 상세 정보</h4>
                <button id="close-sheet-btn">X</button>
            </div>
            <p>🌡️ 체감 온도: <span id="ui-utci">-</span>°C</p>
            <p>🌳 그늘 비율: <span id="ui-shade">-</span>%</p>
            <p>💨 풍속: <span id="ui-wind">-</span>m/s</p>
            <p>🔥 종합 더위 점수: <span id="ui-score">-</span>점</p>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
